  <script>
  document.querySelector('.primary-btn').addEventListener('click', function() {
    const nombre = document.querySelector('input[type="text"]:nth-of-type(1)').value.trim();
    const direccion = document.querySelector('input[type="text"]:nth-of-type(2)').value.trim();
    const mensaje = document.getElementById('msg-agenda');

    if (nombre === '' || direccion === '') {
      mensaje.style.display = 'block';
    } else {
      mensaje.style.display = 'none';
      alert('¡Visita programada exitosamente!');
    }
  });
</script>
