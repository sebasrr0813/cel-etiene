<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cel-etiene - Pago con tarjeta</title>
  <link rel="stylesheet" href="tarjeta.css" />
</head>

<body>
  <div class="page">


    <header class="topbar">
      <div class="brand">
       
        <div class="title">Cel-etiene</div>
      </div>


    </header>

    <main class="main">

      <div class="steps" aria-label="Progreso de compra">
        <div class="step done">
          <span class="icon">🛒</span>
          <span class="lbl">Carrito</span>
        </div>
        <span class="dash"></span>
        <div class="step done">
          <span class="icon">👤</span>
          <span class="lbl">Datos</span>
        </div>
        <span class="dash"></span>
        <div class="step done">
          <span class="icon">🚚</span>
          <span class="lbl">Entrega</span>
        </div>
        <span class="dash"></span>
        <div class="step active">
          <span class="icon">$</span>
          <span class="lbl">Pagó</span>
        </div>
      </div>

      <div class="content">

        <div class="bank-float" aria-hidden="true">
          <div class="bank-card">
            <span class="bank-name">Davivienda</span>
            <span class="chip"></span>
          </div>
          <div class="bank-card back">
            <span class="bank-name">Club</span>
            <span class="chip"></span>
          </div>
        </div>


        <section class="pay-form" aria-label="Formulario de tarjeta">
          <div class="grid">
            <div class="field">
              <label for="num">*Número de la tarjeta</label>
              <input id="num" type="text" />
            </div>

            <div class="field">
              <label for="cuotas">*Número de cuotas</label>
              <select id="cuotas">
                <option value="" selected></option>
                <option>1</option>
                <option>3</option>
                <option>6</option>
                <option>12</option>
              </select>
            </div>

            <div class="field full">
              <label for="nombre">*Nombre como aparece en la tarjeta</label>
              <input id="nombre" type="text" />
            </div>

            <div class="field">
              <label>*Fecha de expiración</label>
              <div class="exp">
                <select aria-label="Mes">
                  <option selected>MM</option>
                  <option>01</option><option>02</option><option>03</option><option>04</option>
                  <option>05</option><option>06</option><option>07</option><option>08</option>
                  <option>09</option><option>10</option><option>11</option><option>12</option>
                </select>
                <select aria-label="Año">
                  <option selected>AA</option>
                  <option>24</option><option>25</option><option>26</option><option>27</option>
                  <option>28</option><option>29</option><option>30</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="cvv">*Código de seguridad</label>
              <input id="cvv" type="password" />
            </div>
          </div>
        </section>

     
        <aside class="summary" aria-label="Resumen y acciones">
          <div class="totals">
            <div class="tline">
              <span>Subtotal:</span>
              <span class="money">$ 5.645.001</span>
            </div>
            <div class="tline">
              <span>Costo de envío:</span>
              <span class="free">Gratis</span>
            </div>
            <div class="tline">
              <span>Total:</span>
              <span class="money">$ 5.645.001</span>
            </div>
          </div>

          <button class="finish" type="button">Finalizar compra</button>
          <button class="back" type="button">Volver al carrito</button>
        </aside>
      </div>

      <button class="logout" type="button">Cerrar sesion</button>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="copyright">
          <div class="circle">C</div>
          <div class="links">
            <div>Todos los derechos reservados</div>
            <a href="#">Política de privacidad</a>
          </div>
        </div>

        <div class="social" aria-label="Redes sociales">
          <button class="icon-btn" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M14 8.5V7.2c0-.8.5-1.2 1.2-1.2H17V3h-2.3C12.6 3 11 4.6 11 6.8v1.7H9v3h2V21h3v-9.5h2.6l.4-3H14Z"
                    fill="white" opacity=".95"/>
            </svg>
          </button>

          <button class="icon-btn" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7.5 3h9A4.5 4.5 0 0 1 21 7.5v9A4.5 4.5 0 0 1 16.5 21h-9A4.5 4.5 0 0 1 3 16.5v-9A4.5 4.5 0 0 1 7.5 3Z"
                    stroke="white" stroke-width="2"/>
              <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="white" stroke-width="2"/>
              <path d="M17.5 6.8h.01" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </button>

          <button class="icon-btn" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 21a9 9 0 1 0-7.8-4.5L3 21l4.7-1.2A9 9 0 0 0 12 21Z"
                    stroke="white" stroke-width="2" stroke-linejoin="round"/>
              <path d="M9.2 8.8c.2-.4.3-.4.6-.4h.5c.1 0 .3 0 .4.3l.7 1.7c.1.2.1.4 0 .6l-.3.4c-.1.1-.2.3 0 .6.2.3.9 1.5 2 2.1.3.2.5.2.7 0l.5-.3c.2-.1.4-.1.6 0l1.6.8c.2.1.3.2.3.4 0 .2 0 .8-.4 1.1-.4.4-1 .6-1.4.6-.4 0-1.8-.2-3.2-1.4-1.5-1.2-2.6-2.8-3-3.5-.3-.7-.3-1.3-.2-1.6.1-.3.4-.7.6-1Z"
                    fill="white" opacity=".92"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
