<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cel-etiene - Servicio</title>
  <link rel="stylesheet" href="servicio.css" />
</head>

<body>
  <div class="page">
    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
  
        <div class="title">Cel-etiene</div>
      </div>
    </header>


    <main class="main">

      <div class="nav-links">
        <a href="#">Inició</a>
        <a href="#">Servicio</a>
        <a href="#">Catálogo</a>
        <a href="#">Sobre nosotros</a>
      </div>

      <p class="subtitle">
        A continuacion seleccion el tipo de soporte requerido
      </p>

      <div class="content">
       
        <section class="service-options">
          
          <div class="box">
            <div class="box-title">▼ Tipo de mantenimiento:</div>
            <label><input type="checkbox"> General</label>
            <label><input type="checkbox"> Software</label>
            <label><input type="checkbox"> Hardware</label>
          </div>

          <div class="option">
            <label><input type="radio" name="servicio"> Cambio de pantalla</label>
          </div>

          <div class="option">
            <label><input type="checkbox"> Cambio de batería</label>
          </div>

          <div class="option">
            <label><input type="checkbox"> Daños de red</label>
          </div>

          <button class="primary-btn">Programa tú visita</button>
        </section>

     
        <section class="hero">
          <div class="hero-card">
            <img src="imagenes/imagen4.jpg" alt="Servicio técnico" />
          </div>
        </section>
      </div>

      <button class="logout">Cerrar sesion</button>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="copyright">
          <div class="circle">C</div>
          <div>
            <div>Todos los derechos reservados</div>
            <a href="#">Política de privacidad</a>
          </div>
        </div>

        <div class="social">
          <button class="icon-btn">F</button>
          <button class="icon-btn">I</button>
          <button class="icon-btn">W</button>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
